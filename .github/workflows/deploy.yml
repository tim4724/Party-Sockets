name: Deploy

on:
  push:
    tags:
      - "[0-9]*"
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write

  deploy-fly:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy ghcr image to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          flyctl deploy --image "ghcr.io/${REPO_LOWER}:${{ needs.build.outputs.image_tag }}"

  deploy-ws-dev:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, k8s]
    steps:
      - uses: actions/checkout@v7
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.37.1

      - name: Deploy preview to Kubernetes
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          trap 'rm -f kubeconfig' EXIT
          echo "${KUBECONFIG_B64}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}:${{ needs.build.outputs.image_tag }}"
          echo "Deploying ${IMAGE}"
          kubectl apply -f k8s/ws-dev.yaml
          kubectl set image deployment/party-sockets-dev party-sockets-dev="${IMAGE}" -n party-sockets-dev
          kubectl rollout status deployment/party-sockets-dev -n party-sockets-dev --timeout=5400s
