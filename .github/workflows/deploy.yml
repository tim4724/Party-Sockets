name: Deploy

# Deploy credentials live in environments, not repo secrets, so a workflow
# pushed on any other branch can't read them: `production` (FLY_API_TOKEN)
# admits only release tags, `ws-dev` (KUBECONFIG_B64) only main.
on:
  push:
    tags:
      - "[0-9]*"
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write

  deploy-fly:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy ghcr image to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          flyctl deploy --image "ghcr.io/${REPO_LOWER}:${{ needs.build.outputs.image_tag }}"

  deploy-ws-dev:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: ws-dev
    runs-on: [self-hosted, k8s]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.2

      - name: Deploy preview to Kubernetes
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          trap 'rm -f kubeconfig' EXIT
          echo "${KUBECONFIG_B64}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}:${{ needs.build.outputs.image_tag }}"
          echo "Deploying ${IMAGE}"
          kubectl apply -f k8s/ws-dev.yaml
          kubectl set image deployment/party-sockets-dev party-sockets-dev="${IMAGE}" -n party-sockets-dev
          kubectl rollout status deployment/party-sockets-dev -n party-sockets-dev --timeout=5400s
